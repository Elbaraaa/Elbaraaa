name: Metrics

# Renders the GitHub stats panel with lowlighter/metrics and commits the SVG
# into this repository. Self-hosting the image is the point: third-party
# render-on-request widgets rate-limit and go down, and a broken image on a
# profile is worse than no image.
#
# Works out of the box with the default GITHUB_TOKEN. To include private and
# organization contributions, create a classic PAT with `repo` + `read:user`
# scope and save it as a repository secret named METRICS_TOKEN.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Base metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          user: Elbaraaa
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Phoenix
          config_output: svg
          # Matches the README's navy / cyan / violet palette.
          config_display: large
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_lines: yes
          plugin_stars: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
